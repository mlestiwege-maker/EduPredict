version: '3.8'

services:
  db:
    image: postgres:18-alpine
    container_name: edupredict-db
    environment:
      POSTGRES_DB: edupredict
      POSTGRES_USER: edupredict
      POSTGRES_PASSWORD: edupredict123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edupredict-backend
    environment:
      DATABASE_URL: postgresql://edupredict:edupredict123@db:5432/edupredict
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edupredict-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  postgres_data: